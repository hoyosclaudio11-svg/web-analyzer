<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activar PRO</title>
</head>
<body style="background:#000;color:#fff;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">
<div style="text-align:center">
  <h2>Activar plan PRO</h2>
  <p style="color:#aaa;margin-bottom:24px">Asegurate de estar logueado antes de hacer clic.</p>
  <button id="btn" style="padding:14px 36px;font-size:16px;background:#58a6ff;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600">Activar PRO</button>
  <p id="msg" style="margin-top:16px;color:#aaa"></p>
</div>
<script>
const btn = document.getElementById('btn');
const msg = document.getElementById('msg');
btn.addEventListener('click', async () => {
  const token = localStorage.getItem('wa_token');
  if (!token) {
    msg.textContent = 'No estás logueado. Ingresá a la app primero.';
    msg.style.color = '#f55';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Activando...';
  try {
    const resp = await fetch('/api/force-upgrade?user_token=' + encodeURIComponent(token));
    const data = await resp.json();
    if (resp.ok) {
      msg.textContent = '¡Listo! Plan PRO activado. Volvé a la app y recargá.';
      msg.style.color = '#5f5';
      btn.textContent = 'Activado';
    } else {
      msg.textContent = 'Error: ' + (data.error || 'desconocido');
      msg.style.color = '#f55';
      btn.disabled = false;
      btn.textContent = 'Reintentar';
    }
  } catch (err) {
    msg.textContent = 'Error de conexión';
    msg.style.color = '#f55';
    btn.disabled = false;
    btn.textContent = 'Reintentar';
  }
});
</script>
</body>
</html>
